[package]
edition      = "2024"
name         = "inkprint-firmware"
rust-version = "1.95"
version      = "0.1.0"

[features]
default        = ["inkplate6"]
inkplate6      = ["board/inkplate6"]
inkplate6v2    = ["board/inkplate6v2"]
inkplate6plus  = ["board/inkplate6plus"]
inkplate10     = ["board/inkplate10"]
inkplate5      = ["board/inkplate5"]
inkplate6color = ["board/inkplate6color"]
# Draw a gray ramp at boot to check the display driver (normally the panel is never
# touched at boot, so the last printed page survives restarts).
panel-test = []

[[bin]]
name = "inkprint"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dhcpv4-hostname",
  "dns",
  "log",
  "medium-ethernet",
  "multicast",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
# HTTP server and mDNS responder on embassy-net (https://crates.io/crates/edge-net).
edge-http        = { version = "0.8.0", default-features = false, features = ["io", "log"] }
edge-mdns        = { version = "0.8.0", default-features = false, features = ["io", "log"] }
edge-nal         = "0.7.0"
# Setup portal: DHCP server and captive DNS on the access point.
edge-captive     = { version = "0.8.0", default-features = false, features = ["io", "log"] }
edge-dhcp        = { version = "0.8.0", default-features = false, features = ["io", "log"] }
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["dhcpv4", "dhcpv4-hostname", "log", "medium-ethernet", "multicast", "proto-ipv4", "tcp", "udp"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32",
  "log-04",
  "unstable",
  "wifi",
] }

critical-section = "1.2.0"
# Settings in the nvs partition.
embedded-hal     = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-storage = "0.3.2"
esp-storage      = { version = "0.10.0", features = ["embedded-storage", "esp32"] }
embassy-futures  = "0.1.2"
embassy-sync     = "0.8.0"
heapless         = { version = "0.9", default-features = false }
# Register access for the I2S1 LCD-mode panel bus; same version esp-hal uses.
esp32            = "0.41.0"

# Shared, host-tested crates.
board        = { path = "../crates/board", default-features = false }
clock        = { path = "../crates/clock" }
dnssd        = { path = "../crates/dnssd" }
epd-inkplate = { path = "../epd-inkplate" }
ipp-codec    = { path = "../crates/ipp-codec" }
ipp-http     = { path = "../crates/ipp-http" }
ipp-printer  = { path = "../crates/ipp-printer" }
raster       = { path = "../crates/raster" }
render       = { path = "../crates/render" }
setup        = { path = "../crates/setup" }
static_cell      = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
