[package]
name         = "ipp-http"
description  = "IPP over HTTP: an edge-http request handler driving ipp-printer"
edition.workspace      = true
version.workspace      = true
rust-version.workspace = true
license.workspace      = true

[dependencies]
board             = { workspace = true }
edge-http         = { version = "0.8.0", default-features = false, features = ["io"] }
edge-nal          = "0.7.0"
embassy-sync      = "0.8.0"
embedded-io-async = "0.7.0"
ipp-codec         = { workspace = true }
ipp-printer       = { workspace = true }
log               = { workspace = true }

[dev-dependencies]
async-io     = "2.6.0"
board        = { workspace = true, features = ["inkplate6"] }
edge-nal-std = "0.7.0"
# Time driver for edge-nal's timeouts on the host.
embassy-time = { version = "0.5.1", features = ["generic-queue-8", "std"] }
